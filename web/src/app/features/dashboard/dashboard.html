<app-page-header
  [today]="calendar.today()"
  [semester]="calendar.semester()"
  [announcementsCount]="announcementsState.announcements().length"
/>

@if (data.error()) {
  <p class="state state--error" role="alert">Не удалось загрузить данные. Попробуйте обновить страницу позже.</p>
} @else {
  @let weekType = calendar.weekType();
  @let schedule = scheduleState.schedule();
  @let todayPlan = scheduleState.todayPlan();

  @if (weekType && schedule && todayPlan) {
    <app-week-indicator
      [weekType]="weekType"
      [weekStart]="calendar.weekStart()"
      [weekEnd]="calendar.weekEnd()"
      [events]="calendar.todayEvents()"
    />

    <div class="layout">
      <div class="main">
        <app-today-lessons
          [plan]="todayPlan"
          [durationMinutes]="schedule.lessonDurationMinutes"
          [subjects]="scheduleState.subjects()"
        />
        <app-week-schedule
          [schedule]="schedule"
          [subjects]="scheduleState.subjects()"
          [currentWeekType]="weekType"
          [todayWeekday]="calendar.todayWeekday()"
        />
      </div>

      <aside class="side" aria-label="Объявления и события">
        <app-announcements-board
          id="announcements"
          [announcements]="announcementsState.announcements()"
          [hasError]="announcementsState.hasError()"
        />
        <app-upcoming-events [items]="calendar.upcoming()" />
      </aside>
    </div>
  } @else {
    <p class="state" aria-live="polite">Загрузка…</p>
  }
}
