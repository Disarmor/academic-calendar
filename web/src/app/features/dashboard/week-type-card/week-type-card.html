<section class="card week week--{{ weekType() }}" aria-labelledby="week-type-title">
  <p class="caption" id="week-type-title">Сейчас идёт неделя</p>
  <p class="type">{{ labels[weekType()] }}</p>
  <p class="range">{{ weekStart() | date: 'd MMMM' }} — {{ weekEnd() | date: 'd MMMM yyyy' }}</p>

  @if (events().length > 0) {
    <ul class="events" aria-label="Сегодня по академическому календарю">
      @for (event of events(); track event.title + event.start) {
        <li class="event event--{{ event.type }}">{{ event.title }}</li>
      }
    </ul>
  }
</section>
