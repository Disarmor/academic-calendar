<button type="button" class="copy" [class.copied]="copied()" [attr.aria-label]="label()" [title]="label()" (click)="copy()">
  <ng-content />
  <svg class="icon" viewBox="0 0 16 16" aria-hidden="true">
    @if (copied()) {
      <path d="M3.5 8.5l3 3 6-7" />
    } @else {
      <rect x="5.5" y="5.5" width="8" height="8" rx="1.5" />
      <path d="M10.5 5.5V3.5a1 1 0 0 0-1-1h-6a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h2" />
    }
  </svg>
</button>
<span class="visually-hidden" aria-live="polite">{{ copied() ? 'Скопировано' : '' }}</span>
